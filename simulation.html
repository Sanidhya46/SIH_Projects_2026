<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart India Hackathon · Working Simulations Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --nk-cyan: #38bdf8;
      --sr-amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Bar */
    header.sim-header {
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 50;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .brand-title {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sim-selector {
      display: flex;
      background: #1e293b;
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }
    .sim-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .sim-tab-btn:hover {
      color: #fff;
    }
    .sim-tab-btn.active-nk {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }
    .sim-tab-btn.active-sr {
      background: #d97706;
      color: #fff;
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.4);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .btn-outline {
      background: #1e293b;
      border-color: #334155;
      color: #e2e8f0;
    }
    .btn-outline:hover {
      border-color: #38bdf8;
      color: #fff;
    }
    .btn-fullscreen {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-fullscreen:hover {
      background: #7dd3fc;
    }

    /* Simulation Viewport */
    main.sim-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    iframe.sim-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #000;
    }
    iframe.sim-frame.active {
      display: block;
    }
  </style>
</head>
<body>

  <header class="sim-header">
    <div class="header-left">
      <div class="brand-title">
        <span>🎮 Working Simulations Hub</span>
      </div>

      <div class="sim-selector">
        <button id="btn-tab-nk" class="sim-tab-btn active-nk" onclick="loadSimulation('nk')">
          💧 Neer Kavach 3D Sim
        </button>
        <button id="btn-tab-sr" class="sim-tab-btn" onclick="loadSimulation('sr')">
          ⚡ Saurya Rakshak 12-Scene Sim
        </button>
      </div>
    </div>

    <div class="header-right">
      <a id="btn-standalone" href="Neer_kavach/simulation.html" target="_blank" class="btn btn-fullscreen">
        Open Fullscreen Standalone ↗
      </a>
      <a id="btn-portal" href="Neer_kavach/index.html" class="btn btn-outline">
        View Project Portal ↗
      </a>
      <a href="index.html" class="btn btn-outline">
        ← Main Directory
      </a>
    </div>
  </header>

  <main class="sim-viewport">
    <iframe id="frame-nk" class="sim-frame active" src="Neer_kavach/simulation.html" title="Neer Kavach 3D Hydraulic Simulation"></iframe>
    <iframe id="frame-sr" class="sim-frame" src="Saurya_Rakshak/simulation.html" title="Saurya Rakshak 12-Scene Industrial Safety Simulation"></iframe>
  </main>

  <script>
    function loadSimulation(simKey) {
      const btnNk = document.getElementById('btn-tab-nk');
      const btnSr = document.getElementById('btn-tab-sr');
      const frameNk = document.getElementById('frame-nk');
      const frameSr = document.getElementById('frame-sr');
      const btnStandalone = document.getElementById('btn-standalone');
      const btnPortal = document.getElementById('btn-portal');

      if (simKey === 'nk') {
        btnNk.className = 'sim-tab-btn active-nk';
        btnSr.className = 'sim-tab-btn';
        frameNk.classList.add('active');
        frameSr.classList.remove('active');
        btnStandalone.href = 'Neer_kavach/simulation.html';
        btnPortal.href = 'Neer_kavach/index.html';
        btnStandalone.style.background = '#38bdf8';
        btnStandalone.style.color = '#0f172a';
        history.replaceState(null, null, '#neer');
      } else {
        btnSr.className = 'sim-tab-btn active-sr';
        btnNk.className = 'sim-tab-btn';
        frameSr.classList.add('active');
        frameNk.classList.remove('active');
        btnStandalone.href = 'Saurya_Rakshak/simulation.html';
        btnPortal.href = 'Saurya_Rakshak/index.html';
        btnStandalone.style.background = '#f59e0b';
        btnStandalone.style.color = '#0f172a';
        history.replaceState(null, null, '#saurya');
      }
    }

    // Auto-select on hash
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.toLowerCase();
      if (hash.includes('saurya') || hash.includes('sr')) {
        loadSimulation('sr');
      } else {
        loadSimulation('nk');
      }
    });
  </script>

</body>
</html>
